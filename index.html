<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deksamnu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'VT323', monospace;
        image-rendering: -moz-crisp-edges;
        image-rendering: -webkit-crisp-edges;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      .font-vt323 {
        font-family: 'VT323', monospace;
      }
      .scanline-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        background: linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0),
          rgba(255, 255, 255, 0) 50%,
          rgba(0, 0, 0, 0.2) 50%,
          rgba(0, 0, 0, 0.2)
        );
        background-size: 100% 4px;
        opacity: 0.3;
        z-index: 9999;
      }
      .text-flicker {
        animation: flicker 4s linear infinite;
      }
      @keyframes flicker {
        0%, 18%, 22%, 25%, 53%, 57%, 100% {
          text-shadow: 0 0 8px #06b6d4, 0 0 12px #0891b2, 0 0 20px #0891b2, 0 0 40px #0891b2, 0 0 80px #0891b2;
          opacity: 1;
        }
        20%, 24%, 55% {
          text-shadow: none;
          opacity: 0.8;
        }
      }

      /* --- PIXEL ART UI STYLES --- */
      * {
        border-radius: 0 !important;
      }

      h1, h2, h3, p, button, input, span, div {
        text-rendering: geometricPrecision;
      }

      .pixel-border {
        border: 4px solid transparent;
        border-image-slice: 2;
        border-image-width: 4px;
        border-image-outset: 2px;
        border-image-source: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='6' height='6' fill='none'><path stroke='%230e7490' stroke-width='2' d='M1 1h1v1H1zm3 0h1v1H4zM1 4h1v1H1zm3 0h1v1H4z'/><path stroke='%2306b6d4' stroke-width='2' d='M2 1h1v1H2zm0 3h1v1H2zM1 2h1v1H1zm3 0h1v1H4z'/></svg>");
        border-image-repeat: round;
        background-clip: padding-box;
      }

      .pixel-border--red {
        border-image-source: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='6' height='6' fill='none'><path stroke='%23991b1b' stroke-width='2' d='M1 1h1v1H1zm3 0h1v1H4zM1 4h1v1H1zm3 0h1v1H4z'/><path stroke='%23ef4444' stroke-width='2' d='M2 1h1v1H2zm0 3h1v1H2zM1 2h1v1H1zm3 0h1v1H4z'/></svg>");
      }
      
      .pixel-border--grey {
        border-image-source: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='6' height='6' fill='none'><path stroke='%234b5563' stroke-width='2' d='M1 1h1v1H1zm3 0h1v1H4zM1 4h1v1H1zm3 0h1v1H4z'/><path stroke='%236b7280' stroke-width='2' d='M2 1h1v1H2zm0 3h1v1H2zM1 2h1v1H1zm3 0h1v1H4z'/></svg>");
      }
      
      .pixel-border--green {
        border-image-source: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='6' height='6' fill='none'><path stroke='%23166534' stroke-width='2' d='M1 1h1v1H1zm3 0h1v1H4zM1 4h1v1H1zm3 0h1v1H4z'/><path stroke='%2322c55e' stroke-width='2' d='M2 1h1v1H2zm0 3h1v1H2zM1 2h1v1H1zm3 0h1v1H4z'/></svg>");
      }

      .pixel-button {
        background-color: rgba(14, 116, 144, 0.4);
        border: 2px solid #083344;
        color: white;
        padding: 8px 16px;
        text-decoration: none;
        display: inline-block;
        font-size: 1.125rem;
        line-height: 1.75rem;
        margin: 2px 1px;
        cursor: pointer;
        box-shadow: inset -2px -2px 0px 0px rgba(6, 182, 212, 0.7);
        transition: all 0.05s linear;
        font-weight: bold;
      }
      .pixel-button:hover:not(:disabled) {
        background-color: rgba(6, 182, 212, 0.5);
      }
      .pixel-button:active:not(:disabled) {
        box-shadow: inset 2px 2px 0px 0px rgba(8, 51, 68, 1);
        transform: translate(1px, 1px);
      }
      .pixel-button:disabled {
        background-color: rgba(55, 65, 81, 0.5);
        border-color: #4b5563;
        color: #9ca3af;
        cursor: not-allowed;
        box-shadow: none;
      }

      .pixel-health-bar {
        width: 100%;
        background-color: rgba(0,0,0,0.7);
        border: 2px solid #1f2937;
        padding: 2px;
        height: 16px;
      }
      .pixel-health-bar > div {
        height: 100%;
        transition: width 0.5s ease;
      }
      .pixel-health-bar--player > div {
        background-color: #22d3ee;
      }
      .pixel-health-bar--enemy > div {
        background-color: #f43f5e;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.25.0"
  }
}
</script>
</head>
  <body class="bg-gray-900">
    <div class="scanline-overlay"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
